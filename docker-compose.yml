services:
  db:
    image: postgres:16
    container_name: tradesim-db
    environment:
      POSTGRES_DB: tradinggame
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../tradesim
    container_name: tradesim-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tradinggame
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: yourpassword
      JWT_SECRET: your-super-secret-key-that-is-long-enough-for-hs256
      JWT_EXPIRATION: 604800000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../tradesim-frontend
    container_name: tradesim-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: